name: Campeones plugin tests

# Distinct file name and workflow name on purpose: entre-redes-prode's CI
# (added on the unmerged release/bump-build-25 branch, not yet on main) is
# hardcoded to `working-directory: wordpress_plugins/entre-redes-prode`. Once
# both plugins are on main, these are worth unifying into a single matrix job
# instead of two near-identical workflows.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-plugin:
    name: Plugin tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: wordpress_plugins/entre-redes-campeones

    strategy:
      fail-fast: false
      matrix:
        # 8.2 is the floor because that is what the production WordPress host
        # runs (8.2.33); composer.json and the plugin header declare the same.
        # 8.5 catches forward-compatibility breakage early.
        #
        # 8.0 was tried and removed: phpunit ^10.5 requires PHP >= 8.1, so the
        # toolchain cannot exercise a floor lower than 8.1 even where the
        # runtime would allow one. Do not declare a floor the suite cannot test.
        #
        # composer.lock is committed (mirroring the prode plugin), so every
        # run resolves the exact same dependency tree instead of picking up
        # whatever a transitive bump resolves to on the day CI happens to run.
        php: ['8.2', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pdo_sqlite backs the in-memory wpdb shim in tests/wp-shim.php;
          # dom/libxml/json are PHPUnit's.
          extensions: mbstring, pdo_sqlite, dom, json, libxml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Test
        run: composer test
