name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/bump-build-25

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Pinned to the version used locally, not `stable`. A floating channel
      # turns an unrelated PR red the day Flutter ships a new lint, which is
      # how a build gate stops being trusted. Bump this deliberately.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # flutter_lints is now an installed dependency and analysis_options.yaml's
      # include resolves, so this gate can enforce the lint suite, not just tests.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  php-plugin:
    name: Plugin tests (${{ matrix.plugin }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wordpress_plugins/${{ matrix.plugin }}
    strategy:
      fail-fast: false
      matrix:
        # Every plugin, both PHP versions — six jobs from one definition.
        # They were two separate workflow files while campeones was still on
        # a branch; the split was never the point, only the timing.
        #
        # Add a plugin here the same commit that adds the plugin. An
        # uncovered plugin does not announce itself: its suite simply never
        # runs, and the first red build is whichever unrelated PR happens to
        # break it months later.
        plugin: [entre-redes-prode, entre-redes-campeones, entre-redes-cambios, entre-redes-credencial]

        # 8.2 is the floor for all of them: it is what the production host
        # runs (8.2.33), and prode's brick/math 0.14.8 — a production
        # dependency via ramsey/uuid — requires ^8.2. Each plugin's
        # config.platform.php pins resolution there so a lock can never
        # outrun the host. 8.5 is what they are developed on; running both
        # catches newer syntax slipping into code that has to execute on 8.2.
        #
        # 8.0 was tried and removed: phpunit ^10.5 requires PHP >= 8.1, so
        # the toolchain cannot exercise a floor lower than 8.1 even where the
        # runtime would allow one. Do not declare a floor the suite cannot test.
        #
        # composer.lock is committed in every plugin, so every run resolves
        # the exact same dependency tree instead of whatever a transitive
        # bump happens to resolve to on the day CI runs.
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pdo_sqlite backs the in-memory wpdb shim in tests/wp-shim.php;
          # openssl is used for prode's JWT signing; dom/libxml/json are
          # PHPUnit's; gd/exif/fileinfo back entre-redes-credencial's photo
          # upload pipeline (Photo\PhotoValidator's finfo + getimagesizefromstring
          # check, Photo\GdPhotoReencoder's decode/rotate/re-encode — added
          # slice 2a). The union is declared for every plugin — an unused
          # extension costs nothing, a missing one fails opaquely.
          extensions: mbstring, pdo_sqlite, dom, json, libxml, openssl, gd, exif, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Test
        run: composer test
